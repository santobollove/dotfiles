########################################
# GUI APPLICATION ENVIRONMENT
########################################

EDITOR=nvim
VISUAL=nvim
BROWSER=google-chrome-stable
TERMINAL=konsole

########################################
# KDE / QT
########################################

QT_QPA_PLATFORMTHEME=qt5ct
KDE_FULL_SESSION=true
KDE_SESSION_VERSION=6

########################################
# Java (GUI safe only)
########################################

JAVA_HOME=/usr/lib/jvm/default
_JAVA_AWT_WM_NONREPARENTING=1

########################################
# Graphics behavior
########################################

LIBGL_DRI3_DISABLE=1

########################################
# OPTIONAL GUI TOOL SETTINGS
########################################

DOOMDIR=/home/vash/.config/doom
AZURE_CONFIG_DIR=/home/vash/.config/azure
DOCKER_CONFIG=/home/vash/.config/docker
GNUPGHOME=/home/vash/.local/share/gnupg
